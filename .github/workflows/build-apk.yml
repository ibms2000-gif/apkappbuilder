name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project UUID stored in the platform database"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apk-build-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download generated Android source
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          API_URL: ${{ secrets.APKAPPBUILDER_API_URL }}
          BUILD_TOKEN: ${{ secrets.APKAPPBUILDER_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$API_URL" || (echo "Missing APKAPPBUILDER_API_URL secret" && exit 1)
          test -n "$BUILD_TOKEN" || (echo "Missing APKAPPBUILDER_BUILD_TOKEN secret" && exit 1)
          curl --fail --silent --show-error -H "Authorization: Bearer $BUILD_TOKEN" "$API_URL/api/build/source?project_id=$PROJECT_ID" -o /tmp/generated-app.json
      - name: Prepare generated application
        run: |
          python3 - <<'PY'
          import json, os, re
          with open("/tmp/generated-app.json", encoding="utf-8") as f:
              app = json.load(f)
          package = app.get("package_name", "")
          code = app.get("main_activity", "")
          name = app.get("app_name", "AI Android App")
          if not re.fullmatch(r"com(?:\.[a-z][a-z0-9_]*){2,}", package):
              raise SystemExit("Invalid generated Android package name")
          if not code.startswith("package " + package + "\n"):
              raise SystemExit("Generated source package does not match project package")
          if not re.search(r"class\s+MainActivity\s*:\s*ComponentActivity\s*\(", code):
              raise SystemExit("MainActivity validation failed")
          os.makedirs("android-template/app/src/main/java", exist_ok=True)
          with open("android-template/app/src/main/java/MainActivity.kt", "w", encoding="utf-8") as f:
              f.write(code)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("GENERATED_PACKAGE=" + package + "\n")
              f.write("GENERATED_APP_NAME=" + name.replace("\n", " ")[:48] + "\n")
          PY
      - name: Build debug APK
        working-directory: android-template
        run: |
          gradle --no-daemon assembleDebug -PgeneratedPackage="$GENERATED_PACKAGE" -PgeneratedAppName="$GENERATED_APP_NAME"
      - name: Upload APK to platform storage
        if: success()
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          API_URL: ${{ secrets.APKAPPBUILDER_API_URL }}
          BUILD_TOKEN: ${{ secrets.APKAPPBUILDER_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          APK="android-template/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          curl --fail --silent --show-error -X PUT -H "Authorization: Bearer $BUILD_TOKEN" -H "X-Project-Id: $PROJECT_ID" -H "Content-Type: application/vnd.android.package-archive" --data-binary "@$APK" "$API_URL/api/build/upload"
      - name: Report build failure
        if: failure()
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          API_URL: ${{ secrets.APKAPPBUILDER_API_URL }}
          BUILD_TOKEN: ${{ secrets.APKAPPBUILDER_BUILD_TOKEN }}
        run: |
          if [ -n "${API_URL:-}" ] && [ -n "${BUILD_TOKEN:-}" ]; then
            curl --silent --show-error -X POST -H "Authorization: Bearer $BUILD_TOKEN" -H "Content-Type: application/json" -d "{\"project_id\":\"$PROJECT_ID\",\"error\":\"فشل بناء APK. افتح سجل GitHub Actions لمعرفة تفاصيل الخطأ.\"}" "$API_URL/api/build/failure" || true
          fi
