name: Build Android APK and Student Report

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project UUID stored in the platform database"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apk-build-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download generated Android source and student details
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          API_URL: ${{ secrets.APKAPPBUILDER_API_URL }}
          BUILD_TOKEN: ${{ secrets.APKAPPBUILDER_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$API_URL" || (echo "Missing APKAPPBUILDER_API_URL secret" && exit 1)
          test -n "$BUILD_TOKEN" || (echo "Missing APKAPPBUILDER_BUILD_TOKEN secret" && exit 1)
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $BUILD_TOKEN" \
            "$API_URL/api/build/source?project_id=$PROJECT_ID" \
            -o /tmp/generated-app.json

      - name: Prepare generated Android application
        run: |
          python3 - <<'PY'
          import json, os, re
          with open("/tmp/generated-app.json", encoding="utf-8") as f:
              app = json.load(f)
          package = app.get("package_name", "")
          code = app.get("main_activity", "")
          name = app.get("app_name", "AI Android App")
          creator = app.get("creator_name", "")
          summary = app.get("summary", "")
          if not re.fullmatch(r"com(?:\.[a-z][a-z0-9_]*){2,}", package):
              raise SystemExit("Invalid generated Android package name")
          if not code.startswith("package " + package + "\n"):
              raise SystemExit("Generated source package does not match project package")
          if not re.search(r"class\s+MainActivity\s*:\s*ComponentActivity\s*\(", code):
              raise SystemExit("MainActivity validation failed")
          if len(creator.strip()) < 2:
              raise SystemExit("Student creator name is required")
          os.makedirs("android-template/app/src/main/java", exist_ok=True)
          with open("android-template/app/src/main/java/MainActivity.kt", "w", encoding="utf-8") as f:
              f.write(code)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("GENERATED_PACKAGE=" + package + "\n")
              f.write("GENERATED_APP_NAME=" + name.replace("\n", " ").replace("\r", " ")[:48] + "\n")
              f.write("CREATOR_NAME=" + creator.replace("\n", " ").replace("\r", " ")[:80] + "\n")
              f.write("PROJECT_SUMMARY=" + summary.replace("\n", " ").replace("\r", " ")[:320] + "\n")
              slug = re.sub(r"[^\w-]+", "-", name, flags=re.UNICODE).strip("-")[:40] or "student-app"
              f.write("REPORT_NAME=" + slug + "-" + app.get("project_id", "project")[:8] + "-report.pdf\n")
          PY

      - name: Build debug APK
        working-directory: android-template
        run: |
          gradle --no-daemon assembleDebug \
            -PgeneratedPackage="$GENERATED_PACKAGE" \
            -PgeneratedAppName="$GENERATED_APP_NAME"

      - name: Prepare public GitHub Release
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp android-template/app/build/outputs/apk/debug/app-debug.apk "release-output/apkappbuilder-$PROJECT_ID.apk"
          echo "RELEASE_TAG=student-app-$PROJECT_ID" >> "$GITHUB_ENV"
          echo "APK_NAME=apkappbuilder-$PROJECT_ID.apk" >> "$GITHUB_ENV"

      - name: Install PDF and Arabic text libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          python3 -m venv /tmp/pdf-venv
          /tmp/pdf-venv/bin/pip install --disable-pip-version-check reportlab "qrcode[pil]" arabic-reshaper python-bidi

      - name: Create public GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          RELEASE_NOTES=$(printf "Student achievement application\\nCreator: %s\\nDescription: %s\\nProject ID: %s\\nGenerated by APK App Builder." "$CREATOR_NAME" "$PROJECT_SUMMARY" "$PROJECT_ID")
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GENERATED_APP_NAME" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA"
          gh release upload "$RELEASE_TAG" "release-output/$APK_NAME" --repo "$GITHUB_REPOSITORY"
          echo "RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_ENV"
          APK_URL="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')"
          test -n "$APK_URL"
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"

      - name: Generate one-page Arabic student achievement PDF with QR code
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          API_URL: ${{ secrets.APKAPPBUILDER_API_URL }}
          BUILD_TOKEN: ${{ secrets.APKAPPBUILDER_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          /tmp/pdf-venv/bin/python - <<'PY'
          import json, os, re, glob
          from io import BytesIO
          from pathlib import Path
          from datetime import datetime
          import arabic_reshaper
          from bidi.algorithm import get_display
          import qrcode
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.lib import colors
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.lib.utils import ImageReader

          with open("/tmp/generated-app.json", encoding="utf-8") as f:
              app = json.load(f)
          font_candidates = glob.glob("/usr/share/fonts/truetype/**/*NotoNaskhArabic-Regular.ttf", recursive=True)
          bold_candidates = glob.glob("/usr/share/fonts/truetype/**/*NotoNaskhArabic-Bold.ttf", recursive=True)
          if not font_candidates:
              raise SystemExit("Noto Naskh Arabic font was not installed")
          pdfmetrics.registerFont(TTFont("Arabic", font_candidates[0]))
          if bold_candidates:
              pdfmetrics.registerFont(TTFont("ArabicBold", bold_candidates[0]))
              bold_font = "ArabicBold"
          else:
              bold_font = "Arabic"
          def rtl(value):
              return get_display(arabic_reshaper.reshape(str(value or "")))
          def draw_rtl(c, value, x, y, max_width, font="Arabic", size=11, color=colors.HexColor("#243247"), leading=18):
              c.setFont(font, size)
              c.setFillColor(color)
              words = str(value or "").split()
              lines, current = [], ""
              for word in words:
                  candidate = (current + " " + word).strip()
                  if pdfmetrics.stringWidth(rtl(candidate), font, size) <= max_width or not current:
                      current = candidate
                  else:
                      lines.append(current)
                      current = word
              if current:
                  lines.append(current)
              for line in lines:
                  c.drawRightString(x, y, rtl(line))
                  y -= leading
              return y
          page_w, page_h = A4
          pdf_path = "release-output/" + os.environ["REPORT_NAME"]
          c = canvas.Canvas(pdf_path, pagesize=A4)
          c.setTitle("Student Achievement - " + app.get("app_name", "Android App"))
          c.setAuthor(app.get("creator_name", ""))
          navy = colors.HexColor("#10233f")
          teal = colors.HexColor("#14866d")
          pale = colors.HexColor("#eef5f7")
          c.setFillColor(pale)
          c.rect(0, 0, page_w, page_h, fill=1, stroke=0)
          c.setFillColor(navy)
          c.roundRect(28, page_h-175, page_w-56, 145, 16, fill=1, stroke=0)
          c.setFillColor(colors.white)
          c.setFont(bold_font, 17)
          c.drawCentredString(page_w/2, page_h-70, rtl("تقرير مشروع إنجاز طلابي"))
          c.setFont("Arabic", 10)
          c.drawCentredString(page_w/2, page_h-96, rtl("تطبيق Android تم إنشاؤه بمساعدة الذكاء الاصطناعي"))
          c.setFillColor(teal)
          c.roundRect(52, page_h-143, page_w-104, 2, 1, fill=1, stroke=0)
          y = page_h-220
          y = draw_rtl(c, app.get("app_name", "تطبيق Android"), page_w-55, y, page_w-110, bold_font, 21, navy, 28)
          y -= 10
          c.setFillColor(colors.white)
          c.roundRect(42, y-75, page_w-84, 65, 10, fill=1, stroke=0)
          y -= 31
          y = draw_rtl(c, "اسم الطالب / منشئ التطبيق: " + app.get("creator_name", ""), page_w-62, y, page_w-124, bold_font, 12, teal, 20)
          y = draw_rtl(c, "وصف المشروع", page_w-62, y-14, page_w-124, bold_font, 13, navy, 20)
          y = draw_rtl(c, app.get("summary", "مشروع تطبيق Android."), page_w-62, y-4, page_w-124, "Arabic", 11, colors.HexColor("#3d4b60"), 18)
          y -= 16
          c.setFillColor(colors.white)
          c.roundRect(42, y-55, page_w-84, 48, 10, fill=1, stroke=0)
          y -= 27
          c.setFont("Arabic", 10)
          c.setFillColor(colors.HexColor("#526176"))
          c.drawRightString(page_w-62, y, rtl("تاريخ الإنشاء: " + app.get("created_at", "")[:10]))
          c.drawRightString(page_w-62, y-17, rtl("رقم المشروع: " + os.environ.get("PROJECT_ID", "")))
          y -= 70
          qr = qrcode.QRCode(version=5, error_correction=qrcode.constants.ERROR_CORRECT_M, box_size=8, border=2)
          download_url = os.environ["APK_URL"]
          qr.add_data(download_url)
          qr.make(fit=True)
          qr_img = qr.make_image(fill_color="#10233f", back_color="white").convert("RGB")
          qr_bytes = BytesIO()
          qr_img.save(qr_bytes, format="PNG")
          qr_bytes.seek(0)
          qr_size = 118
          c.setFillColor(colors.white)
          c.roundRect(page_w/2-qr_size/2-16, y-qr_size-60, qr_size+32, qr_size+84, 12, fill=1, stroke=0)
          c.drawImage(ImageReader(qr_bytes), page_w/2-qr_size/2, y-qr_size-8, qr_size, qr_size, mask="auto")
          c.setFillColor(navy)
          c.setFont(bold_font, 11)
          c.drawCentredString(page_w/2, y-qr_size-24, rtl("امسح الرمز لتنزيل التطبيق"))
          c.setFillColor(colors.HexColor("#526176"))
          c.setFont("Helvetica", 5.8)
          url_line = download_url.replace("https://", "")
          c.drawCentredString(page_w/2, y-qr_size-43, url_line)
          c.linkURL(download_url, (page_w/2-220, y-qr_size-50, page_w/2+220, y-qr_size-36), relative=0)
          c.setFillColor(teal)
          c.setFont("Helvetica", 8)
          c.drawCentredString(page_w/2, 76, "APK App Builder  |  GitHub Releases")
          c.setFillColor(colors.HexColor("#53637a"))
          c.setFont("Helvetica", 7)
          c.drawCentredString(page_w/2, 62, "Public download link is embedded in the QR code.")
          c.save()
          PY

      - name: Upload student report PDF to the same release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "release-output/$REPORT_NAME" --repo "$GITHUB_REPOSITORY"
          REPORT_URL="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name | endswith("-report.pdf")) | .browser_download_url')"
          test -n "$REPORT_URL"
          echo "REPORT_URL=$REPORT_URL" >> "$GITHUB_ENV"

      - name: Mark project as published in D1
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          API_URL: ${{ secrets.APKAPPBUILDER_API_URL }}
          BUILD_TOKEN: ${{ secrets.APKAPPBUILDER_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          export RELEASE_URL APK_URL REPORT_URL
          python3 - <<'PY'
          import json, os, urllib.request
          payload = {
              "project_id": os.environ["PROJECT_ID"],
              "release_url": os.environ["RELEASE_URL"],
              "apk_url": os.environ["APK_URL"],
              "report_url": os.environ["REPORT_URL"]
          }
          request = urllib.request.Request(
              os.environ["API_URL"] + "/api/build/published",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Authorization":"Bearer " + os.environ["BUILD_TOKEN"], "Content-Type":"application/json"},
              method="POST"
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.read().decode("utf-8"))
          PY

      - name: Report build failure
        if: failure()
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          API_URL: ${{ secrets.APKAPPBUILDER_API_URL }}
          BUILD_TOKEN: ${{ secrets.APKAPPBUILDER_BUILD_TOKEN }}
        run: |
          if [ -n "${API_URL:-}" ] && [ -n "${BUILD_TOKEN:-}" ]; then
            python3 - <<'PY' || true
            import json, os, urllib.request
            payload = {"project_id": os.environ["PROJECT_ID"], "error": "فشل بناء التطبيق أو إنشاء تقرير PDF أو نشر GitHub Release. راجع سجل GitHub Actions."}
            req = urllib.request.Request(os.environ["API_URL"] + "/api/build/failure", data=json.dumps(payload).encode(), headers={"Authorization":"Bearer " + os.environ["BUILD_TOKEN"],"Content-Type":"application/json"}, method="POST")
            with urllib.request.urlopen(req, timeout=15) as response:
                print(response.read().decode())
            PY
          fi
