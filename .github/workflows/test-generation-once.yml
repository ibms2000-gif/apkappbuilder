name: One-time Live Generation Test

on:
  push:
    paths:
      - ".test-generation-trigger"

permissions:
  contents: read

jobs:
  live-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Generate one temporary test application and verify APK/PDF
        env:
          API_URL: ${{ secrets.APKAPPBUILDER_API_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          DEVICE_ID="$(cat /proc/sys/kernel/random/uuid)"
          PROJECT_ID=""
          cleanup() {
            if [ -n "$PROJECT_ID" ] && [ -n "$ADMIN_PASSWORD" ]; then
              echo "Removing temporary public test project..."
              curl --silent --show-error --max-time 20 \
                -X DELETE "$API_URL/api/admin/projects/$PROJECT_ID" \
                -H "Authorization: Bearer $ADMIN_PASSWORD" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          RESPONSE="$(curl --silent --show-error --max-time 220 \
            -X POST "$API_URL/api/generate" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg device "$DEVICE_ID" \
              --arg prompt "أنشئ تطبيق مهام يومية عربي بسيط. أظهر عنوان مهامي، حقل نص لإضافة مهمة، زر إضافة، قائمة مهام، ومربع تحديد الإنجاز وزر حذف لكل مهمة. استخدم الحالة المحلية في Jetpack Compose فقط ولا تستخدم الإنترنت أو مكتبات خارجية." \
              '{deviceId:$device, creatorName:"اختبار آلي للمنصة", appName:"اختبار التوليد", prompt:$prompt}')")"

          echo "$RESPONSE" | jq .
          PROJECT_ID="$(echo "$RESPONSE" | jq -r '.projectId // empty')"
          if [ -z "$PROJECT_ID" ]; then
            echo "Generation API did not return a project ID."
            exit 1
          fi

          STATUS="building"
          for attempt in $(seq 1 180); do
            CURRENT="$(curl --silent --show-error --max-time 15 \
              "$API_URL/api/projects/$PROJECT_ID?device_id=$DEVICE_ID")"
            STATUS="$(echo "$CURRENT" | jq -r '.status // "unknown"')"
            echo "Project status: $STATUS (check $attempt/180)"
            if [ "$STATUS" = "ready" ]; then
              echo "$CURRENT" | jq '{status, downloadUrl, reportUrl, releaseUrl}'
              test "$(echo "$CURRENT" | jq -r '.downloadUrl // empty')" != ""
              test "$(echo "$CURRENT" | jq -r '.reportUrl // empty')" != ""
              echo "PASS: AI generation, Android APK build, public release and PDF report all completed."
              exit 0
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "$CURRENT" | jq .
              echo "The generated project or Android build failed."
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for the build. Last status: $STATUS"
          exit 1
